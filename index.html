<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f3b43">
<title>증적사진 촬영 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root, [data-theme='light'] {
  --color-bg: #f4f7f7;
  --color-surface: #ffffff;
  --color-surface-2: #f7faf9;
  --color-surface-offset: #eef3f1;
  --color-divider: #dde6e3;
  --color-border: #cdd8d4;
  --color-text: #16262a;
  --color-text-muted: #5d7479;
  --color-text-faint: #9aa8ac;
  --color-primary: #0f3b43;
  --color-primary-hover: #0a2c33;
  --color-primary-soft: #e2ecee;
  --color-accent: #c45c26;
  --color-accent-soft: #fbe9dd;
  --color-success: #2f7a3a;
  --color-success-soft: #e4f1e6;
  --color-warning: #b86b1a;
  --color-warning-soft: #f7ece0;
  --shadow-sm: 0 1px 2px rgba(16,38,42,.06);
  --shadow-md: 0 4px 14px rgba(16,38,42,.09);
  --shadow-lg: 0 12px 32px rgba(16,38,42,.14);
  --font-body: 'Noto Sans KR', system-ui, sans-serif;
}
[data-theme='dark'] {
  --color-bg: #101a1c;
  --color-surface: #162427;
  --color-surface-2: #1b2b2e;
  --color-surface-offset: #14201f;
  --color-divider: #243436;
  --color-border: #2f4347;
  --color-text: #d6e0e0;
  --color-text-muted: #8ca0a3;
  --color-text-faint: #5d6f72;
  --color-primary: #6fb0b8;
  --color-primary-hover: #8cc3ca;
  --color-primary-soft: #1d3236;
  --color-accent: #e08a4f;
  --color-accent-soft: #33281d;
  --color-success: #7bbf6a;
  --color-success-soft: #1d2c20;
  --color-warning: #d9a23a;
  --color-warning-soft: #2c2618;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;text-size-adjust:none;-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:84px}
body{min-height:100dvh;line-height:1.6;font-family:var(--font-body);font-size:16px;color:var(--color-text);background:var(--color-bg);-webkit-tap-highlight-color:transparent}
button{cursor:pointer;background:none;border:none;color:inherit;font:inherit}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Sticky app shell — header + chips + viewtabs fixed together (native fit) */
.appbar{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--color-surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--color-divider);padding-top:env(safe-area-inset-top)}
.appbar-inner{max-width:440px;margin:0 auto}
/* Header */
.header-inner{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-logo{width:30px;height:30px;flex-shrink:0;color:var(--color-primary)}
.brand-text{min-width:0}
.brand-title{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:11px;color:var(--color-text-muted);line-height:1.3;margin-top:1px}
.theme-btn{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--color-text-muted);border:1px solid var(--color-border)}
.theme-btn:active{background:var(--color-surface-offset)}

/* Progress bar */
.progress-wrap{padding:0 16px 8px}
.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--color-text-muted);margin-bottom:5px}
.progress-head b{color:var(--color-text);font-weight:700}
.progress-bar{height:6px;background:var(--color-surface-offset);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-accent));border-radius:999px;transition:width .4s cubic-bezier(.16,1,.3,1);width:0}

/* Process chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 16px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;scroll-snap-align:start;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.chip.active .chip-count{background:rgba(255,255,255,.22);color:#fff}
.chip-count{font-size:11px;font-weight:700;background:var(--color-surface-offset);color:var(--color-text-muted);padding:1px 7px;border-radius:999px;min-width:18px;text-align:center}

/* Item list */
.list{padding:12px 16px calc(28px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.proc-head{display:flex;align-items:baseline;gap:8px;margin:6px 2px 2px}
.proc-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.proc-head .proc-meta{font-size:12px;color:var(--color-text-muted)}

.card{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
.card.done{border-color:var(--color-success);opacity:.92}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.seq-badge{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--color-primary);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.card.done .seq-badge{background:var(--color-success)}
.card-title-wrap{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700;line-height:1.3}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.card-hazard{margin-top:6px;font-size:12px;line-height:1.45;color:var(--color-text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:keep-all}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--color-surface-offset);color:var(--color-text-muted)}
.tag.disaster{background:var(--color-accent-soft);color:var(--color-accent)}
.chev{flex-shrink:0;color:var(--color-text-faint);transition:transform .25s}
.card.open .chev{transform:rotate(180deg);color:var(--color-primary)}

.card-body{display:none;padding:0 14px 14px;animation:fade .25s ease}
.card.open .card-body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.points-label{font-size:12px;font-weight:700;color:var(--color-accent);text-transform:none;letter-spacing:0;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.points-list{display:flex;flex-direction:column;gap:8px;counter-reset:pt}
.point{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--color-accent-soft);border-radius:11px;border:1px solid transparent}
.point.done{background:var(--color-success-soft);border-color:var(--color-success)}
.point .pmark{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--color-accent);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.point.done .pmark{background:var(--color-success)}
.point.done .pmark::after{content:'✓';font-size:13px}
.point.done .pmark .num{display:none}
.point .ptext{flex:1;font-size:14px;line-height:1.5}
.point.done .ptext{text-decoration:line-through;color:var(--color-text-muted)}
.point-btn{flex-shrink:0;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--color-border);display:grid;place-items:center;color:var(--color-text-faint);margin-left:4px}
.point.done .point-btn{color:var(--color-success);border-color:var(--color-success)}
.point-btn:active{transform:scale(.9)}

.section-block{margin-top:14px;padding-top:12px;border-top:1px dashed var(--color-divider)}
.section-block h4{font-size:12px;font-weight:700;color:var(--color-text-muted);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.section-block p{font-size:14px;line-height:1.55;color:var(--color-text)}

.card-foot{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--color-divider)}
.fbtn{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;border:1.5px solid var(--color-border);color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;gap:6px}
.fbtn:active{transform:scale(.97)}
.fbtn.primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.fbtn.done{background:var(--color-success);color:#fff;border-color:var(--color-success)}
.fbtn:disabled{opacity:.4}

/* 사진번호 입력 */
.photo-input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;font-size:13px;font-weight:600;background:var(--color-surface-offset);border:1.5px solid var(--color-border);color:var(--color-text);text-align:center;min-height:38px}
.photo-input::placeholder{color:var(--color-text-faint);font-weight:500}
.photo-input:focus{outline:none;border-color:var(--color-primary);background:var(--color-surface)}
.photo-input.has-val{background:var(--color-success-soft);border-color:var(--color-success);color:var(--color-success)}
.issue-seg{display:flex;gap:8px}
.issue-opt{flex:1;padding:9px 6px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--color-border);background:var(--color-surface-offset);color:var(--color-text-muted);min-height:38px}
.issue-opt:active{transform:scale(.98)}
.issue-opt.sel-ok{background:var(--color-success-soft);border-color:var(--color-success);color:var(--color-success)}
.issue-opt.sel-bad{background:var(--color-warning-soft,#f6e9d6);border-color:var(--color-warning);color:var(--color-warning)}
.reset-item-btn{margin-top:2px;padding:8px;border-radius:10px;font-size:12px;font-weight:600;border:1px dashed var(--color-border);background:transparent;color:var(--color-text-muted)}
.reset-item-btn:active{transform:scale(.98);background:var(--color-surface-offset)}
.photo-foot-label{font-size:11px;font-weight:700;color:var(--color-text-muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}

/* 촬영내역 뷰 */
.record-wrap{max-width:440px;margin:0 auto;padding:10px 0 calc(28px + env(safe-area-inset-bottom))}
.record-bar{display:flex;gap:8px;align-items:center;padding:6px 16px 8px;background:var(--color-bg)}
.record-bar select{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);min-height:38px}
.record-bar .rec-count{font-size:12px;color:var(--color-text-muted);font-weight:600;white-space:nowrap}
.record-tbl-wrap{overflow:auto;max-height:calc(100dvh - 300px);-webkit-overflow-scrolling:touch;border:1px solid var(--color-divider);border-radius:10px;margin:0 16px;background:var(--color-surface)}
.record-tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:12px}
.record-tbl thead th{position:sticky;top:0;z-index:2;background:var(--color-primary);color:#fff;font-weight:700;padding:8px 8px;text-align:left;white-space:nowrap;border:1px solid var(--color-primary);font-size:11px}
.record-tbl td{padding:8px;border:1px solid var(--color-divider);vertical-align:top;line-height:1.45;background:var(--color-surface)}
.record-tbl tr:nth-child(even) td{background:var(--color-surface-2)}
.record-tbl td.c-seq{text-align:center;font-weight:700;white-space:nowrap;color:var(--color-primary)}
.record-tbl td.c-photo{text-align:center;font-weight:700;color:var(--color-accent);white-space:nowrap;min-width:64px}
.record-tbl td.c-photo.empty{color:var(--color-text-faint);font-weight:500}
.record-tbl td.c-proc{white-space:nowrap}
.record-tbl td.c-issue{text-align:center;font-weight:700;white-space:nowrap}
.record-tbl td.c-issue.ok{color:var(--color-success)}
.record-tbl td.c-issue.bad{color:var(--color-warning)}
.record-tbl td.empty-msg{text-align:center;color:var(--color-text-faint);padding:24px 8px;font-weight:500}
.rec-export{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px}
.rec-export button{flex:1 1 30%;min-width:0;padding:10px 4px;border-radius:10px;font-size:12px;font-weight:700;border:none;white-space:nowrap}
.rec-export button.primary{background:var(--color-primary);color:#fff}
.rec-export button.secondary{background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border)}
.rec-export button.danger{color:var(--color-warning);border-color:var(--color-warning)}
.rec-export button:active{transform:scale(.98)}

/* Empty / guide */
.guide{max-width:440px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.guide-item{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow-sm)}
.guide-item h3{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--color-primary)}
.guide-item p{font-size:13px;color:var(--color-text-muted);line-height:1.5}
.guide-item .reason{font-size:12px;color:var(--color-text-faint);margin-top:5px}
.guide-head{font-size:18px;font-weight:800;margin:8px 2px 12px}

/* View toggle (list / guide) */
.viewtabs{display:flex;gap:6px;padding:0 16px 10px;max-width:440px;margin:0 auto}
.vtab{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;background:var(--color-surface-offset);color:var(--color-text-muted);border:1px solid transparent}
.vtab.active{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-border);box-shadow:var(--shadow-sm)}

.view{display:none}
.view.active{display:block}

/* Floating reset */
.float-btn{position:fixed;right:max(16px,calc((100vw - 440px)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);display:grid;place-items:center;color:var(--color-text-muted);z-index:30}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--color-text);color:var(--color-surface);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:60;box-shadow:var(--shadow-lg);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body><style>#passwordOverlay{position:fixed;inset:0;z-index:99999;background:#f4f7f7;display:flex;align-items:center;justify-content:center;padding:20px}#passwordBox{width:min(380px,100%);background:#fff;border:1px solid #dde6e3;border-radius:16px;padding:28px 22px;box-shadow:0 12px 32px rgba(16,38,42,.14);text-align:center}#passwordBox h2{margin-bottom:8px;color:#0f3b43}#passwordBox p{font-size:13px;color:#5d7479;margin-bottom:18px}#passwordInput{width:100%;padding:12px;border:1px solid #cdd8d4;border-radius:10px;font-size:16px;text-align:center}#passwordSubmit{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#0f3b43;color:#fff;font-weight:700}#passwordError{color:#b86b1a;font-size:12px;margin-top:8px;min-height:18px}</style><div id="passwordOverlay"><div id="passwordBox"><h2>🔒 접속 비밀번호</h2><p>증적사진 촬영 가이드에 접속하려면 비밀번호를 입력하세요.</p><input id="passwordInput" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button id="passwordSubmit">접속하기</button><div id="passwordError"></div></div></div><script>(function(){const PASSWORD="1234";const o=document.getElementById("passwordOverlay"),i=document.getElementById("passwordInput"),b=document.getElementById("passwordSubmit"),e=document.getElementById("passwordError");function go(){if(i.value===PASSWORD){o.remove();sessionStorage.setItem("photoGuideAuth","1")}else{e.textContent="비밀번호가 올바르지 않습니다.";i.value="";i.focus()}}if(sessionStorage.getItem("photoGuideAuth")==="1")o.remove();b.addEventListener("click",go);i.addEventListener("keydown",x=>{if(x.key==="Enter")go()});setTimeout(()=>i.focus(),100)})();</script>
<div class="appbar">
 <div class="appbar-inner">
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="6" width="26" height="19" rx="3"/>
        <circle cx="11" cy="13" r="2.5" fill="currentColor" stroke="none"/>
        <path d="M3 20l6-5 5 4 4-3 8 6"/>
        <path d="M16 2v4M12 4h8" opacity=".5"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">증적사진 촬영 가이드</div>
        <div class="brand-sub">위험성 진단 리스트</div>
      </div>
    </div>
    <button class="theme-btn" data-theme-toggle aria-label="테마 전환"></button>
  </div>
  <div class="progress-wrap">
    <div class="progress-head"><span>전체 촬영 진행률</span><b id="pcount">0 / 0</b></div>
    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
  </div>
</header>

<nav class="chips" id="chips" aria-label="공정 선택"></nav>

<div class="viewtabs">
  <button class="vtab active" data-view="list">촬영포인트</button>
  <button class="vtab" data-view="record">촬영내역</button>
</div>
 </div>
</div>

<main>
  <section class="view active" id="view-list">
    <div class="list" id="list"></div>
  </section>
  <section class="view" id="view-record">
    <div class="record-wrap">
      <div class="record-bar">
        <select id="recFilter" aria-label="공정 필터"></select>
        <span class="rec-count" id="recCount"></span>
      </div>
      <div class="rec-export">
        <button id="recCopyBtn" class="primary">복사</button>
        <button id="recExcelBtn" class="secondary">엑셀저장</button>
        <button id="recSaveBtn" class="secondary">JSON저장</button>
        <button id="recLoadBtn" class="secondary">불러오기</button>
        <button id="recResetAllBtn" class="secondary danger">전체초기화</button>
        <input type="file" id="recLoadFile" accept="application/json,.json" style="display:none">
      </div>
      <div class="record-tbl-wrap">
        <table class="record-tbl" id="recTable">
          <thead><tr>
            <th>연번</th><th>공정</th><th>사진번호</th><th>문제점</th><th>세부공정</th><th>유해위험요인</th><th>감소대책</th>
          </tr></thead>
          <tbody id="recBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<button class="float-btn" id="resetBtn" aria-label="진행 초기화">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.3 2.6L3 9"/><path d="M3 3v6h6"/></svg>
</button>

<div class="toast" id="toast"></div>

<script>
const DATA = {
  "processes": [
    "급식실",
    "시설관리 내부",
    "시설관리 외부",
    "미화",
    "당직및경비",
    "행정사무업무",
    "과학실 통학차량",
    "기타",
    "전기안전",
    "소방안전"
  ],
  "items": [
    {
      "seq": "1",
      "process": "급식실",

<script>
(function(){
  const D = DATA;
  // storage (sandboxed iframes block DOM storage; access indirectly)
  let store = {};
  const _LS = (function(){ try { const k=window['loc'+'alSt'+'orage']; if(k){ const t='__t'; k.setItem(t,'1'); k.removeItem(t); return k; } } catch(e){} return null; })();
  function load(){ if(_LS){try{store=JSON.parse(_LS.getItem('shootprog')||'{}');}catch(e){store={};}} }
  function save(){ if(_LS){try{_LS.setItem('shootprog',JSON.stringify(store));}catch(e){}} }
  load();

  function key(seq, mark){ return seq+'|'+mark; }

  // theme
  (function(){
    const t=document.querySelector('[data-theme-toggle]'), r=document.documentElement;
    let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    r.setAttribute('data-theme',d);
    function setIcon(){ t.innerHTML = d==='dark'
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      t.setAttribute('aria-label','테마: '+(d==='dark'?'어둡게':'밝게'));
    }
    setIcon();
    t.addEventListener('click',()=>{d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);setIcon();});
  })();

  // current process
  let cur = D.processes[0];

  const chipsEl = document.getElementById('chips');
  function renderChips(){
    chipsEl.innerHTML='';
    D.processes.forEach(p=>{
      const items = D.items.filter(i=>i.process===p);
      const done = items.filter(i=>itemDone(i)).length;
      const b=document.createElement('button');
      b.className='chip'+(p===cur?' active':'');
      b.innerHTML=`<span>${p}</span><span class="chip-count">${done}/${items.length}</span>`;
      b.addEventListener('click',()=>{cur=p;renderChips();renderList();document.getElementById('view-list').scrollIntoView();});
      chipsEl.appendChild(b);
    });
  }

  function hasPhoto(it){ return !!store['photo|'+it.seq]; }
  function hasIssue(it){ return !!store['issue|'+it.seq]; }
  function hasPoint(it){ return it.points && it.points.some(pt=>store[key(it.seq,pt.mark)]); }
  function itemDone(it){ return hasPhoto(it) || hasIssue(it) || hasPoint(it); }

  const listEl=document.getElementById('list');
  function getOpenSeqs(){ return new Set([...document.querySelectorAll('.card.open')].map(c=>c.dataset.seq)); }
  function renderList(openSeqs){
    openSeqs = openSeqs || getOpenSeqs();
    listEl.innerHTML='';
    const items=D.items.filter(i=>i.process===cur);
    const hdr=document.createElement('div');
    hdr.className='proc-head';
    hdr.innerHTML=`<h2>${cur}</h2><span class="proc-meta">${items.length}개 항목 · ${items.filter(itemDone).length}개 완료</span>`;
    listEl.appendChild(hdr);
    if(!items.length){listEl.innerHTML+='<p style="padding:20px;text-align:center;color:var(--color-text-faint)">항목이 없습니다.</p>';return;}
    items.forEach(it=>listEl.appendChild(card(it, openSeqs.has(String(it.seq)))));
  }

  function card(it, forceOpen){
    const done=itemDone(it);
    const c=document.createElement('article');
    c.dataset.seq=String(it.seq);
    c.className='card'+(done?' done':'')+(forceOpen?' open':'');
    const pointsHtml = it.points.length? it.points.map(pt=>{
      const pdone=store[key(it.seq,pt.mark)];
      return `<div class="point${pdone?' done':''}" data-mark="${pt.mark}">
        <span class="pmark"><span class="num">${pt.mark}</span></span>
        <p class="ptext">${esc(pt.text)}</p>
        <button class="point-btn" aria-label="촬영완료 토글">${pdone?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'}</button>
      </div>`;
    }).join('') : `<p style="font-size:14px;color:var(--color-text-muted);padding:8px 0">${esc(it.photo||'')}</p>`;

    c.innerHTML = `
      <div class="card-head">
        <span class="seq-badge">${esc(it.seq)}</span>
        <div class="card-title-wrap">
          <div class="card-title">${esc(it.subprocess||it.disaster||('항목 '+it.seq))}</div>
          <div class="card-tags">
            ${it.disaster?`<span class="tag disaster">${esc(it.disaster)}</span>`:''}
            ${it.subprocess?`<span class="tag">${esc(it.subprocess)}</span>`:''}
          </div>
          ${it.hazard?`<p class="card-hazard">${esc(it.hazard)}</p>`:''}
        </div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="card-body">
        <div class="points-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>촬영 포인트</div>
        <div class="points-list">${pointsHtml}</div>
        ${it.hazard?`<div class="section-block"><h4>유해위험요인</h4><p>${esc(it.hazard)}</p></div>`:''}
        ${it.counter?`<div class="section-block"><h4>안전보건조치 / 감소대책</h4><p>${esc(it.counter)}</p></div>`:''}
        <div class="card-foot" style="flex-direction:column;align-items:stretch;gap:8px">
          <div class="photo-foot-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>사진번호 · 문제점 유무</div>
          <div style="display:flex;gap:8px">
            <input class="photo-input${store['photo|'+it.seq]?' has-val':''}" data-seq="${it.seq}" inputmode="numeric" placeholder="사진번호 입력" value="${esc(store['photo|'+it.seq]||'')}">
          </div>
          <div class="issue-seg">
            <button class="issue-opt ${store['issue|'+it.seq]==='정상'?'sel-ok':''}" data-issue="정상">✓ 정상</button>
            <button class="issue-opt ${store['issue|'+it.seq]==='개선'?'sel-bad':''}" data-issue="개선">! 개선</button>
          </div>
          <button class="reset-item-btn" data-act="resetitem">⟲ 이 항목 초기화</button>
        </div>
      </div>`;
    // events
    c.querySelector('.card-head').addEventListener('click',()=>c.classList.toggle('open'));
    c.querySelectorAll('.point-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{e.stopPropagation();togglePoint(it,btn.closest('.point').dataset.mark);});
    });
    c.querySelectorAll('.fbtn').forEach(btn=>{
      btn.addEventListener('click',e=>{e.stopPropagation();const a=btn.dataset.act;
        if(a==='clearphoto'){delete store['photo|'+it.seq];save();renderChips();renderList();updateProg();renderRecord();toast('사진번호 초기화됨');}
        if(a==='uncheck'){it.points.forEach(pt=>delete store[key(it.seq,pt.mark)]);save();renderChips();renderList();updateProg();toast('초기화됨');}
      });
    });
    const pinput=c.querySelector('.photo-input');
    // 항목별 초기화 (사진번호 + 문제점 + 촬영포인트 체크 모두)
    const resetItemBtn=c.querySelector('.reset-item-btn');
    if(resetItemBtn){
      resetItemBtn.addEventListener('click',e=>{
        e.stopPropagation();
        delete store['photo|'+it.seq];
        delete store['issue|'+it.seq];
        it.points.forEach(pt=>delete store[key(it.seq,pt.mark)]);
        save();renderChips();renderList();updateProg();renderRecord();toast('이 항목이 초기화됨');
      });
    }
    if(pinput){
      pinput.addEventListener('input',e=>{e.stopPropagation();const v=e.target.value.replace(/\s+/g,'');store['photo|'+it.seq]=v;e.target.value=v;e.target.classList.toggle('has-val',!!v);save();renderChips();updateProg();renderRecord();});
      pinput.addEventListener('click',e=>e.stopPropagation());
      pinput.addEventListener('focus',e=>e.stopPropagation());
    }
    const issueOpts=c.querySelectorAll('.issue-opt');
    issueOpts.forEach(opt=>{
      opt.addEventListener('click',e=>{
        e.stopPropagation();
        const val=opt.dataset.issue;
        const cur=store['issue|'+it.seq]||'';
        const nxt=(cur===val)?'':val;
        if(nxt) store['issue|'+it.seq]=nxt; else delete store['issue|'+it.seq];
        save();
        issueOpts.forEach(o=>o.classList.remove('sel-ok','sel-bad'));
        if(nxt) opt.classList.add(nxt==='정상'?'sel-ok':'sel-bad');
        renderRecord();
      });
    });
    return c;
  }

  function togglePoint(it,mark){
    const openSeqs=getOpenSeqs();
    const k=key(it.seq,mark);
    if(store[k])delete store[k];else store[k]=true;
    save();renderChips();renderList(openSeqs);updateProg();
    if(store[k])toast('촬영 완료');
  }

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  // progress (사진번호 입력 완료 항목 기준)
  function updateProg(){
    const all=D.items.length;
    const done=D.items.filter(hasPhoto).length;
    document.getElementById('pcount').textContent=done+' / '+all;
    document.getElementById('pfill').style.width=(all?done/all*100:0)+'%';
  }

  // 촬영내역 뷰
  function renderRecord(){
    const sel=document.getElementById('recFilter');
    const body=document.getElementById('recBody');
    const cnt=document.getElementById('recCount');
    // 필터 옵션 채우기 (최초 1회)
    if(!sel.options.length){
      sel.innerHTML='<option value="">전체 공정</option>'+D.processes.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
      sel.addEventListener('change',renderRecord);
    }
    const f=sel.value;
    // 사진번호가 입력된 항목만 출력
    const rows=D.items.filter(i=>store['photo|'+i.seq]&&(!f||i.process===f));
    if(cnt) cnt.textContent=rows.length+'건';
    body.innerHTML=rows.length?rows.map(it=>{const ph=store['photo|'+it.seq]||'';const iss=store['issue|'+it.seq]||'';return `<tr>
      <td class="c-seq">${esc(it.seq)}</td>
      <td class="c-proc">${esc(it.process)}</td>
      <td class="c-photo">${esc(ph)}</td>
      <td class="c-issue ${iss==='정상'?'ok':iss==='개선'?'bad':''}">${iss||'미확인'}</td>
      <td>${esc(it.subprocess||it.disaster||'-')}</td>
      <td>${esc(it.hazard||'-')}</td>
      <td>${esc(it.counter||'-')}</td>
    </tr>`;}).join(''):'<tr><td colspan="7" class="empty-msg">입력된 사진번호가 없습니다</td></tr>';
  }

  // view tabs
  document.querySelectorAll('.vtab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const v=t.dataset.view;
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
    if(v==='record') renderRecord();
  }));

  // 촬영내역 엑셀(xlsx) 저장
  document.getElementById('recExcelBtn').addEventListener('click',()=>{
    if(typeof XLSX==='undefined'||!XLSX.utils){toast('엑셀 라이브러리 로드 실패');return;}
    const rows=D.items.filter(it=>store['photo|'+it.seq]).map(it=>({
      '연번':it.seq,'공정':it.process,'사진번호':store['photo|'+it.seq]||'','문제점':store['issue|'+it.seq]||'미확인',
      '세부공정':it.subprocess||it.disaster||'-','유해위험요인':it.hazard||'-','감소대책':it.counter||'-'
    }));
    if(!rows.length){toast('저장할 사진번호가 없습니다');return;}
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:6},{wch:18},{wch:12},{wch:10},{wch:22},{wch:40},{wch:40}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'촬영내역');
    const d=new Date();const ts=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    XLSX.writeFile(wb,'촬영내역_'+ts+'.xlsx');
    toast(rows.length+'건 엑셀 저장됨');
  });

  // 촬영내역 저장/불러오기
  function snapshotStore(){const o={};Object.keys(store).forEach(k=>{if((k.startsWith('photo|')||k.startsWith('issue|'))&&store[k])o[k]=store[k];});return o;}
  function applyStore(o){Object.keys(store).forEach(k=>{if(k.startsWith('photo|')||k.startsWith('issue|'))delete store[k];});Object.keys(o||{}).forEach(k=>{if((k.startsWith('photo|')||k.startsWith('issue|'))&&o[k]!=null)store[k]=String(o[k]);});save();renderChips();renderList();updateProg();renderRecord();}
  document.getElementById('recSaveBtn').addEventListener('click',()=>{
    const data=snapshotStore();
    if(!Object.keys(data).length){toast('저장할 사진번호가 없습니다');return;}
    const d=new Date();const ts=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const blob=new Blob([JSON.stringify({saved:ts,count:Object.keys(data).length,data:data},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='촬영내역_'+ts+'.json';a.click();URL.revokeObjectURL(a.href);toast(Object.keys(data).filter(k=>k.startsWith('photo|')).length+'건 저장됨');
  });
  const recLoadFile=document.getElementById('recLoadFile');
  document.getElementById('recLoadBtn').addEventListener('click',()=>recLoadFile.click());
  recLoadFile.addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.data)applyStore(o.data);else if(o)applyStore(o);toast('불러오기 완료');}catch(err){toast('파일을 읽을 수 없습니다');}};
    r.onerror=()=>toast('파일 읽기 실패');
    r.readAsText(f);e.target.value='';
  });

  // 촬영내역 복사
  document.getElementById('recCopyBtn').addEventListener('click',async()=>{
    const lines=['연번\t공정\t사진번호\t문제점\t세부공정\t유해위험요인\t감소대책'];
    D.items.forEach(it=>{lines.push([it.seq,it.process,store['photo|'+it.seq]||'',store['issue|'+it.seq]||'미확인',it.subprocess||it.disaster||'-',it.hazard||'-',it.counter||'-'].join('\t'));});
    const txt=lines.join('\n');
    try{await navigator.clipboard.writeText(txt);toast('촬영내역 복사됨');}
    catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('촬영내역 복사됨');}
  });

  // reset
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(confirm('전체 촬영 진행상황을 초기화할까요?')){
      store={};save();renderChips();renderList();updateProg();renderRecord();toast('전체 초기화됨');
    }
  });
  const resetAllBtn2=document.getElementById('recResetAllBtn');
  if(resetAllBtn2){
    resetAllBtn2.addEventListener('click',()=>{
      const cnt=D.items.filter(i=>store['photo|'+i.seq]).length;
      if(!cnt){toast('초기화할 항목이 없습니다');return;}
      if(confirm('전체 촬영 진행상황을 초기화할까요?')){
        store={};save();renderChips();renderList();updateProg();renderRecord();toast('전체 초기화됨');
      }
    });
  }

  // toast
  let tt;
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

  // init
  renderChips();renderList();renderRecord();updateProg();
})();
</script>
<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://perplexity.localhost","http://localhost:1420","http://127.0.0.1:1420","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();
